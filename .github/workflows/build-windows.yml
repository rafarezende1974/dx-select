name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate assets (icone proprio)
        run: python generate_assets.py

      - name: Build EXE (PyInstaller, arquivo unico)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DXSelect --icon assets/icon.ico app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dx-select
          path: dist/DXSelect.exe
